<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guide UGC: ragazza o ragazzo? | Carlotta Spinelli</title>
<meta name="description" content="Scegli la guida giusta per iniziare come UGC creator.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=swap">
<style>
:root{--yellow:#fcfcc6;--pink:#fcbce1;--blue:#bfe3fa;--black:#0b0b0b;--f:"Montserrat","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box;margin:0}
body{font-family:var(--f);color:var(--black);background:var(--yellow);min-height:100vh;display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));text-align:center}
main{width:100%;max-width:720px}
.eyebrow{font-size:.74rem;font-weight:800;letter-spacing:.22em;text-transform:uppercase}
h1{font-size:clamp(2rem,7vw,3.2rem);line-height:1.04;letter-spacing:-.035em;font-weight:800;margin:14px 0 12px;text-wrap:balance}
p.lead{font-weight:500;max-width:46ch;margin:0 auto 30px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.opt{display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;min-height:190px;padding:24px 18px;border:2.5px solid var(--black);border-radius:26px;box-shadow:6px 6px 0 var(--black);text-decoration:none;color:inherit;transition:transform .25s,box-shadow .25s}
.opt:hover{transform:translateY(-4px) rotate(-1deg);box-shadow:6px 10px 0 var(--black)}
.opt b{font-size:1.7rem;font-weight:800;letter-spacing:-.03em}
.opt span{font-weight:500;font-size:.92rem}
.g{background:var(--pink)}.m{background:var(--blue)}
@media(max-width:520px){.opts{grid-template-columns:1fr}.opt{min-height:140px}}
</style>
</head>
<body>
<main>
<p class="eyebrow">UGC Level Up</p>
<h1>Sei una ragazza o un ragazzo?</h1>
<p class="lead">Le guide gratuite per iniziare come UGC creator sono due: scegli quella pensata per te.</p>
<div class="opts">
<a class="opt g" href="/link/"><b>Ragazza</b><span>Vai alla mia pagina →</span></a>
<a class="opt m" href="/uomo-primi-passi/"><b>Ragazzo</b><span>Primi passi + contatti brand →</span></a>
</div>
</main>
</body>
</html>
