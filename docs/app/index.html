<title>Gestionale UGC</title>

<style>
:root{--yellow:#fcfcc6;--pink:#fcbce1;--black:#0b0b0b}
*{box-sizing:border-box;margin:0}
body{font-family:Montserrat,"Helvetica Neue",Arial,sans-serif;background:var(--pink);color:var(--black);min-height:100svh;display:grid;place-items:center;padding:24px}
.card{background:#fff;border:2px solid var(--black);border-radius:28px;box-shadow:6px 6px 0 var(--black);padding:34px 28px;max-width:420px;width:100%;text-align:center;display:flex;flex-direction:column;gap:16px}
h1{font-weight:800;font-size:2rem;letter-spacing:-.02em;line-height:1.05}
h1 span{background:linear-gradient(transparent 52%,var(--yellow) 52%);padding:0 .12em}
p{color:#444;font-weight:500}
a.btn{display:inline-block;background:var(--black);color:#fff;border:2px solid var(--black);border-radius:999px;padding:14px 28px;font-weight:700;text-decoration:none;transition:transform .25s,background .25s,color .25s}
a.btn:hover{transform:translateY(-3px) rotate(-1deg);background:var(--yellow);color:var(--black)}
</style>
</head>
<body>
<main class="card">
  <h1><span>Gestionale UGC</span></h1>
  <p>Ti porto all'app. Serve essere collegati al proprio account Claude.</p>
  <a class="btn" href="https://claude.ai/artifact/HAPNYL57WBwfhkQTKkXSjj">Apri il gestionale</a>
</main>
<script>setTimeout(function(){location.replace("https://claude.ai/artifact/HAPNYL57WBwfhkQTKkXSjj")},1800)</script>
</body>
</html>
