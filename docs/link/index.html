<style>
:root{--yellow:#fcfcc6;--pink:#fcbce1;--black:#0b0b0b}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;background:var(--yellow);color:var(--black);font-family:Montserrat,"Helvetica Neue",Arial,sans-serif;display:flex;justify-content:center;padding:40px 20px}
main{width:100%;max-width:440px;text-align:center}
.pic{width:132px;height:132px;border-radius:50%;background:var(--pink);margin:0 auto 18px;overflow:hidden;border:3px solid var(--black)}
.pic img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;display:block}
h1{font-size:26px;font-weight:800;letter-spacing:-.01em}
p.sub{margin:6px 0 28px;font-size:15px;font-weight:500}
a.btn{display:block;padding:17px 20px;margin-bottom:12px;background:var(--black);color:#fff;border:2px solid var(--black);border-radius:999px;text-decoration:none;font-weight:700;font-size:15px;transition:transform .15s,background .15s,color .15s}
a.btn.alt{background:var(--pink);color:var(--black)}
a.btn:hover{transform:translateY(-2px)}
footer{margin-top:28px;font-size:12px;opacity:.7}
</style>
</head>
<body>
<main>
  <div class="pic"><img src="/assets/ac9d713ca22c9f7093f7d01a39e34080.png" alt="Carlotta Spinelli"></div>

  <p class="sub">UGC creator</p>
  <a class="btn" href="/">Guarda il portfolio</a>

  <footer>carlottaugcitalia.com</footer>
</main>
</body>
