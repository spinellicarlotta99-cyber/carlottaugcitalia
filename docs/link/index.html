<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Carlotta Spinelli | UGC Creator & Coach</title>
<meta name="description" content="Carlotta Spinelli, Italian UGC creator & coach. Portfolio and course.">
<meta property="og:title" content="Carlotta Spinelli | UGC Creator & Coach">
<meta property="og:image" content="/assets/phone-crop.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--yellow:#fcfcc6;--pink:#fcbce1;--hot:#f58ec3;--black:#0b0b0b}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:Montserrat,"Helvetica Neue",Arial,sans-serif;overflow-x:hidden;min-height:100svh;display:flex;justify-content:center;color:var(--black)}
main{position:relative;z-index:1;width:100%;max-width:460px;padding:max(26px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom));text-align:center;display:flex;flex-direction:column;align-items:center}
.layer{position:absolute;inset:0;transition:transform .25s ease-out;will-change:transform}
.stage{position:relative;width:100%;height:clamp(500px,calc(100svh - 190px),680px);margin-top:6px}
.photo{position:absolute;left:50%;transform:translateX(calc(-50% + var(--tx,0px))) rotate(var(--rot,0deg)) scale(var(--sc,1));transform-origin:50% 90%;transition:transform .5s cubic-bezier(.2,.9,.3,1.3);pointer-events:auto;touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none}
.photo img{pointer-events:none;-webkit-user-drag:none}
.photo.drag{transition:transform .08s linear}
.photo.pop{animation:pop .7s ease-out}
@keyframes pop{0%{scale:1}25%{scale:1.08 .94}50%{scale:.96 1.06}75%{scale:1.03 .98}100%{scale:1}}
.layer{pointer-events:none}
.burst{position:fixed;z-index:20;pointer-events:none;font-size:1.3rem;animation:burst .8s ease-out forwards}
@keyframes burst{from{opacity:1;transform:translate(0,0) scale(.6)}to{opacity:0;transform:translate(var(--bx),var(--by)) scale(1.4) rotate(160deg)}}
.stage.touch .dot{animation-duration:2s}.stage.touch .star{animation-duration:2.5s}.stage.touch .chip{animation-duration:1.6s}.stage.touch .arrows path{animation-duration:.5s}
.photo img{display:block;width:100%;height:auto;animation:bob 6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
@keyframes float2{50%{transform:translateY(-14px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{50%{transform:translate(24px,-34px) scale(1.1)}}
@keyframes dash{to{stroke-dashoffset:-26}}
@keyframes marq{to{transform:translateX(-50%)}}
.card{position:absolute;display:block;text-decoration:none;color:var(--black);z-index:4}
.card b{display:block;font-weight:800;line-height:1.15;letter-spacing:-.01em}
.card span{display:block;font-weight:700}
.card span i{font-style:normal;display:inline-block;transition:transform .3s}
.card:hover span i,.card:focus-visible span i{transform:translateX(6px)}
footer{margin-top:14px;font-size:.75rem;font-weight:700;opacity:.8}
@media(min-width:700px){body{align-items:center}.stage{height:600px}}
.card,.chip{touch-action:manipulation}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

body{background:var(--hot)}
.bg{position:fixed;inset:0;z-index:0;background:radial-gradient(60% 40% at 85% 10%,#fcd3ea 0,transparent 70%),radial-gradient(60% 40% at 5% 95%,var(--yellow) 0,transparent 70%),var(--hot)}
.blob{position:fixed;border-radius:50%;filter:blur(50px);opacity:.7;z-index:0;animation:float 12s ease-in-out infinite}
.b1{width:300px;height:300px;background:var(--yellow);left:-90px;top:30%}.b2{width:260px;height:260px;background:#fff;right:-80px;bottom:12%;animation-delay:-5s}
.top{font-size:.72rem;font-weight:800;letter-spacing:.22em;text-transform:uppercase}
h1{font-size:clamp(2.1rem,10vw,2.8rem);font-weight:800;letter-spacing:-.03em;line-height:1;margin:8px 0 4px}
h1 em{font-style:normal;background:linear-gradient(transparent 55%,var(--yellow) 55%);padding:0 .1em}
.sub{font-size:.95rem;font-weight:600}
.photo{bottom:1%;width:min(94%,430px);filter:drop-shadow(0 16px 24px rgba(120,20,80,.25))}
.ring{position:absolute;left:50%;bottom:4%;width:88%;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;background:var(--pink);border:3px solid var(--black)}
.dot{position:absolute;border-radius:50%;animation:float2 6s ease-in-out infinite}
.d1{width:26px;height:26px;background:#fff;left:6%;top:70%}.d2{width:18px;height:18px;background:var(--yellow);right:5%;top:8%;animation-delay:-2s}.d3{width:34px;height:34px;background:var(--black);right:10%;bottom:6%;animation-delay:-4s}
.star{position:absolute;font-size:2.2rem;line-height:1;animation:spin 9s linear infinite}.s1{left:44%;top:4%}.s2{right:4%;top:48%;font-size:1.6rem;animation-direction:reverse}
.chip{position:absolute;padding:7px 13px;background:#fff;border:2.5px solid var(--black);border-radius:999px;font-size:.78rem;font-weight:800;animation:float2 5s ease-in-out infinite;z-index:3}.k1{right:2%;top:59%}.k2{left:2%;top:68%;animation-delay:-2s;background:var(--yellow)}.k3{right:6%;top:47%;animation-delay:-3.5s;background:var(--black);color:#fff}.stage[class*="lean-"] .chip{animation-duration:1.6s}
.arrows{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.arrows path{fill:none;stroke:var(--black);stroke-width:2.2;stroke-linecap:round;stroke-dasharray:6 7;animation:dash 1.4s linear infinite}
.arrows .hd{stroke-dasharray:none;animation:none;stroke-width:2.6;stroke-linejoin:round}
.card{width:47%;padding:12px 14px 11px;background:#fff;border:2.5px solid var(--black);border-radius:22px;text-align:left;box-shadow:5px 6px 0 var(--black);transition:transform .35s cubic-bezier(.2,.9,.3,1.4),background .2s,box-shadow .2s}
.card b{font-size:1rem}.card span{margin-top:5px;font-size:.76rem;opacity:.75}
.c1{left:0;top:2%;transform:rotate(-3deg)}.c2{right:0;top:26%;transform:rotate(2.5deg)}
.card:hover,.card:focus-visible,.card:active{background:var(--pink);transform:rotate(0) scale(1.07) translateY(-4px);box-shadow:8px 10px 0 var(--black);outline:none}
.stage.lean-1 .photo{transform:translateX(-56%) rotate(-5deg) scale(1.03)}.stage.lean-2 .photo{transform:translateX(-44%) rotate(5deg) scale(1.03)}
.stage[class*="lean-"] .dot{animation-duration:2s}.stage[class*="lean-"] .star{animation-duration:3s}.stage[class*="lean-"] .arrows path{animation-duration:.5s}
</style>
</head>
<body>
<div class="bg"></div><div class="blob b1"></div><div class="blob b2"></div>
<main>
  <div class="top">Italian UGC creator &amp; coach · Milan</div>
  <h1>Carlotta <em>Spinelli</em></h1>
  <p class="sub">Pick your path</p>
  <div class="stage" id="stage">
    <div class="layer" data-d="10"><div class="ring"></div><div class="dot d1"></div><div class="dot d2"></div><div class="dot d3"></div><div class="star s1">✦</div><div class="star s2">✦</div></div>
    <svg class="arrows" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <path d="M24 14 C 20 29, 31 41, 42 49" vector-effect="non-scaling-stroke"/>
      <path d="M80 41 C 77 46, 70 49, 62 50" vector-effect="non-scaling-stroke"/>
    
    </svg>
    <div class="layer" data-d="-16"><div class="photo" id="photo"><img src="/assets/phone-crop.png" alt="Carlotta Spinelli"></div></div>
    <div class="layer" data-d="-26" style="pointer-events:none"><span class="chip k1">UGC</span><span class="chip k2">Coach</span><span class="chip k3">Recruiter</span></div>
    <a class="card c1" data-lean="1" data-go="brand" href="/"><b>Are you a brand?</b><span>See my portfolio <i>→</i></span></a>
    <a class="card c2" data-lean="2" data-go="creator" href="#"><b>Are you a creator?</b><span>Discover the course <i>→</i></span></a>
  </div>
  <footer>carlottaugcitalia.com</footer>
</main>
<script>
/* ===== DA COMPILARE ===== */
var COURSE_URL = "https://www.carlottaspinelli.com/";
var SETTERS = [];                  // numeri WhatsApp (per dopo)
var FALLBACK = "mailto:spinelli.carlotta99@gmail.com?subject=";
/* ======================== */
(function(){
  var go={brand:function(){return "/"},creator:function(){return COURSE_URL||FALLBACK+encodeURIComponent("Course info")}};
  var st=document.getElementById("stage");
  [].forEach.call(document.querySelectorAll(".card"),function(c){
    var k=c.dataset.go;
    c.addEventListener("click",function(e){e.preventDefault();var u=go[k]();if(/^https?:/.test(u))window.open(u,"_blank","noopener");else location.href=u});
    var on=function(){st.className="stage lean-"+c.dataset.lean},off=function(){st.className="stage"};
    c.addEventListener("mouseenter",on);c.addEventListener("mouseleave",off);
    c.addEventListener("focus",on);c.addEventListener("blur",off);
    c.addEventListener("touchstart",on,{passive:true});c.addEventListener("touchend",function(){setTimeout(off,400)});
  });
  var layers=[].slice.call(document.querySelectorAll(".layer"));
  function move(x,y){var nx=x/innerWidth-.5,ny=y/innerHeight-.5;layers.forEach(function(l){var d=+l.dataset.d;l.style.transform="translate("+(nx*d)+"px,"+(ny*d)+"px)"})}
  addEventListener("pointermove",function(e){move(e.clientX,e.clientY)});
  addEventListener("deviceorientation",function(e){if(e.gamma==null)return;move(innerWidth*(.5+e.gamma/90),innerHeight*(.5+(e.beta-45)/90))});
})();

(function(){
  var ph=document.getElementById("photo"),st=document.getElementById("stage"),drag=false,t;
  function tilt(e){var r=ph.getBoundingClientRect(),dx=(e.clientX-(r.left+r.width/2))/r.width,dy=(e.clientY-r.top)/r.height;
    ph.style.setProperty("--rot",(dx*16).toFixed(1)+"deg");ph.style.setProperty("--tx",(dx*26).toFixed(0)+"px");ph.style.setProperty("--sc",(1.03+Math.max(0,.5-dy)*.06).toFixed(3))}
  function reset(){["--rot","--tx","--sc"].forEach(function(v){ph.style.removeProperty(v)})}
  function burst(x,y){for(var i=0;i<7;i++){var b=document.createElement("span"),a=Math.PI*2*i/7+Math.random()*.6,d=45+Math.random()*40;b.className="burst";b.textContent="✦";b.style.left=x+"px";b.style.top=y+"px";b.style.setProperty("--bx",Math.cos(a)*d+"px");b.style.setProperty("--by",Math.sin(a)*d+"px");b.style.color=["#fff","#0b0b0b","#fcfcc6","#f58ec3"][i%4];document.body.appendChild(b);setTimeout(function(x){x.remove()},900,b)}}
  ph.addEventListener("pointerdown",function(e){drag=true;try{ph.setPointerCapture(e.pointerId)}catch(_){}ph.classList.add("drag");ph.classList.remove("pop");st.classList.add("touch");tilt(e);burst(e.clientX,e.clientY);if(navigator.vibrate)navigator.vibrate(12)});
  ph.addEventListener("pointermove",function(e){if(drag||e.pointerType==="mouse")tilt(e)});
  function end(){if(!drag)return;drag=false;ph.classList.remove("drag");reset();void ph.offsetWidth;ph.classList.add("pop");clearTimeout(t);t=setTimeout(function(){st.classList.remove("touch");ph.classList.remove("pop")},900)}
  ph.addEventListener("pointerup",end);ph.addEventListener("pointercancel",end);
  ph.addEventListener("pointerleave",function(e){if(e.pointerType==="mouse"){reset()}});
})();
</script>
</body>
</html>
