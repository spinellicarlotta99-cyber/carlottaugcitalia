<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Carlotta Spinelli | UGC Creator & Coach</title>
<meta name="description" content="Carlotta Spinelli, Italian UGC creator & coach. Portfolio and course.">
<meta property="og:title" content="Carlotta Spinelli | UGC Creator & Coach">
<meta property="og:image" content="/assets/633f23deb9d547e4226ae7b269038e5f.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--yellow:#fcfcc6;--pink:#fcbce1;--hot:#f58ec3;--black:#0b0b0b}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:Montserrat,"Helvetica Neue",Arial,sans-serif;overflow-x:hidden;min-height:100svh;display:flex;justify-content:center;color:var(--black)}
main{position:relative;z-index:1;width:100%;max-width:460px;padding:max(26px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom));text-align:center;display:flex;flex-direction:column;align-items:center}
.layer{position:absolute;inset:0;transition:transform .25s ease-out;will-change:transform}
.stage{position:relative;width:100%;height:clamp(500px,calc(100svh - 190px),680px);margin-top:6px}
.photo{position:absolute;left:50%;transform:translateX(-50%);transition:transform .5s cubic-bezier(.2,.9,.3,1.3)}
.photo img{display:block;width:100%;height:auto;animation:bob 6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
@keyframes float2{50%{transform:translateY(-14px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{50%{transform:translate(24px,-34px) scale(1.1)}}
@keyframes dash{to{stroke-dashoffset:-26}}
@keyframes marq{to{transform:translateX(-50%)}}
.card{position:absolute;display:block;text-decoration:none;color:var(--black);z-index:4}
.card b{display:block;font-weight:800;line-height:1.15;letter-spacing:-.01em}
.card span{display:block;font-weight:700}
.card span i{font-style:normal;display:inline-block;transition:transform .3s}
.card:hover span i,.card:focus-visible span i{transform:translateX(6px)}
footer{margin-top:14px;font-size:.75rem;font-weight:700;opacity:.8}
@media(min-width:700px){body{align-items:center}.stage{height:600px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

body{background:var(--yellow)}
.bg{position:fixed;inset:0;z-index:0;background:radial-gradient(50% 35% at 100% 0,var(--pink) 0,transparent 70%),radial-gradient(50% 35% at 0 100%,var(--pink) 0,transparent 70%),var(--yellow)}
h1{font-size:clamp(2.4rem,12vw,3.3rem);font-weight:800;letter-spacing:-.04em;line-height:.95;margin-top:4px}
h1 em{font-style:normal;color:var(--hot);-webkit-text-stroke:2px var(--black)}
.top{font-size:.72rem;font-weight:800;letter-spacing:.22em;text-transform:uppercase}
.arch{position:absolute;left:50%;bottom:0;width:78%;height:78%;transform:translateX(-50%);background:var(--hot);border:3px solid var(--black);border-radius:999px 999px 26px 26px;overflow:hidden}
.arch::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.18) 0 10px,transparent 10px 22px);animation:slide 6s linear infinite}
@keyframes slide{to{background-position:62px 0}}
.photo{bottom:0;width:min(96%,440px);filter:drop-shadow(0 14px 18px rgba(120,20,80,.3))}
.chip{position:absolute;padding:7px 13px;background:#fff;border:2.5px solid var(--black);border-radius:999px;font-size:.78rem;font-weight:800;animation:float2 5s ease-in-out infinite;z-index:3}
.k1{right:2%;top:46%}.k2{left:2%;top:60%;animation-delay:-2s;background:var(--yellow)}.k3{right:6%;top:70%;animation-delay:-3.5s;background:var(--black);color:#fff}
.star{position:absolute;font-size:2rem;animation:spin 8s linear infinite}.s1{left:12%;top:36%}.s2{right:14%;top:22%;animation-direction:reverse}
.card{width:80%;padding:15px 20px;background:var(--black);color:#fff;border-radius:999px;box-shadow:0 6px 0 var(--hot);display:flex;justify-content:space-between;align-items:center;text-align:left;transition:transform .35s cubic-bezier(.2,.9,.3,1.4),background .2s,color .2s,box-shadow .2s}
.card b{font-size:1.02rem}.card span{font-size:.72rem;opacity:.8;margin-top:2px}
.card .arr{font-size:1.4rem;font-weight:800;transition:transform .3s}
.c1{left:0;top:1%;transform:rotate(-2deg)}.c2{right:0;top:17%;transform:rotate(2deg)}
.card:hover,.card:focus-visible,.card:active{background:var(--hot);color:var(--black);box-shadow:0 10px 0 var(--black);outline:none}
.c1:hover,.c1:focus-visible,.c1:active{transform:rotate(0) scale(1.06) translateY(-4px)}
.c2:hover,.c2:focus-visible,.c2:active{transform:rotate(0) scale(1.06) translateY(-4px)}
.card:hover .arr{transform:translateX(6px) rotate(-45deg)}
.stage.lean-1 .photo{transform:translateX(-52%) rotate(-3deg) scale(1.03)}.stage.lean-2 .photo{transform:translateX(-48%) rotate(3deg) scale(1.03)}
.stage[class*="lean-"] .chip{animation-duration:1.6s}.stage[class*="lean-"] .star{animation-duration:2.5s}.stage[class*="lean-"] .arch::after{animation-duration:1.5s}
</style>
</head>
<body>
<div class="bg"></div>
<main>
  <div class="top">UGC creator &amp; coach · Milan</div>
  <h1>Carlotta<br><em>Spinelli</em></h1>
  <div class="stage" id="stage">
    <div class="layer" data-d="8"><div class="arch"></div><div class="star s1">✦</div><div class="star s2">✦</div></div>
    <div class="layer" data-d="-14"><div class="photo" id="photo" style="width:min(88%,400px)"><img src="/assets/633f23deb9d547e4226ae7b269038e5f.png" alt="Carlotta Spinelli"></div></div>
    <div class="layer" data-d="-26" style="pointer-events:none"><span class="chip k1">UGC</span><span class="chip k2">Coach</span><span class="chip k3">Recruiter</span></div>
    <a class="card c1" data-lean="1" data-go="brand" href="/"><div><b>Are you a brand?</b><span>See my portfolio</span></div><div class="arr">→</div></a>
    <a class="card c2" data-lean="2" data-go="creator" href="#"><div><b>Are you a creator?</b><span>Discover the course</span></div><div class="arr">→</div></a>
  </div>
  <footer>carlottaugcitalia.com</footer>
</main>
<script>
/* ===== DA COMPILARE ===== */
var COURSE_URL = "https://www.carlottaspinelli.com/";
var SETTERS = [];                  // numeri WhatsApp (per dopo)
var FALLBACK = "mailto:spinelli.carlotta99@gmail.com?subject=";
/* ======================== */
(function(){
  var go={brand:function(){return "/"},creator:function(){return COURSE_URL||FALLBACK+encodeURIComponent("Course info")}};
  var st=document.getElementById("stage");
  [].forEach.call(document.querySelectorAll(".card"),function(c){
    var k=c.dataset.go;
    c.addEventListener("click",function(e){e.preventDefault();var u=go[k]();if(/^https?:/.test(u))window.open(u,"_blank","noopener");else location.href=u});
    var on=function(){st.className="stage lean-"+c.dataset.lean},off=function(){st.className="stage"};
    c.addEventListener("mouseenter",on);c.addEventListener("mouseleave",off);
    c.addEventListener("focus",on);c.addEventListener("blur",off);
    c.addEventListener("touchstart",on,{passive:true});c.addEventListener("touchend",function(){setTimeout(off,400)});
  });
  var layers=[].slice.call(document.querySelectorAll(".layer"));
  function move(x,y){var nx=x/innerWidth-.5,ny=y/innerHeight-.5;layers.forEach(function(l){var d=+l.dataset.d;l.style.transform="translate("+(nx*d)+"px,"+(ny*d)+"px)"})}
  addEventListener("pointermove",function(e){move(e.clientX,e.clientY)});
  addEventListener("deviceorientation",function(e){if(e.gamma==null)return;move(innerWidth*(.5+e.gamma/90),innerHeight*(.5+(e.beta-45)/90))});
})();
</script>
</body>
</html>
